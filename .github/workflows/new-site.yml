name: new-site

# Deploys new-site/ (v2.end-gfw.com) to Cloudflare Workers.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus
# Workers Routes / DNS edit on the end-gfw.com zone) and CLOUDFLARE_ACCOUNT_ID.
# Without them the job only builds and tests.
on:
  push:
    branches: [v2]
    paths: ['new-site/**', '.github/workflows/new-site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN not set, skipping deploy"; exit 0; fi
          # wrangler never removes routes from another Worker, so hand the end-gfw.com
          # routes over from the old site's Worker (end-gfw-legacy) right before deploying
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone=$(curl -fsS -H "$auth" "$api/zones?name=end-gfw.com" | jq -r '.result[0].id')
          curl -fsS -H "$auth" "$api/zones/$zone/workers/routes" \
            | jq -r '.result[] | select(.script != "end-gfw-new" and (.pattern == "end-gfw.com/*" or .pattern == "www.end-gfw.com/*")) | "\(.id) \(.pattern) \(.script)"' \
            | while read -r id pattern script; do
                echo "removing route $pattern from $script"
                curl -fsS -X DELETE -H "$auth" "$api/zones/$zone/workers/routes/$id" >/dev/null
              done
          npx wrangler deploy
