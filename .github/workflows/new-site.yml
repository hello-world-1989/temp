name: new-site

# Deploys new-site/ (new.end-gfw.com) to Cloudflare Workers.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus
# Workers Routes / DNS edit on the end-gfw.com zone) and CLOUDFLARE_ACCOUNT_ID.
# Without them the job only builds and tests.
on:
  push:
    branches: [main]
    paths: ['new-site/**', '.github/workflows/new-site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN not set, skipping deploy"; exit 0; fi
          npx wrangler deploy
