name: Update apps

# 每月检查 vpn.json 里软件的上游新版本，有更新就覆盖上传到本仓库的 release（android / windows / mac），
# 并把 public/temp/vpn.json 对应条目的 date 改成当天。来源配置见 scripts/update-apps/sources.json。
on:
  schedule:
    - cron: '17 20 1 * *' # 每月 1 号 UTC 20:17（北京时间 2 号 04:17）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只检查不上传'
        type: boolean
        default: true
      only:
        description: '只处理这些文件（逗号分隔，如 android-hiddify.zip），留空=全部'
        type: string
        default: ''
      force:
        description: '不管版本是否变化都重新上传'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check and update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force || false }}
        run: node scripts/update-apps/update.mjs

      - name: Commit vpn.json and state
        if: always()
        run: |
          if git diff --quiet -- public/temp/vpn.json scripts/update-apps/state.json && [ -z "$(git ls-files --others --exclude-standard scripts/update-apps/state.json)" ]; then
            echo "nothing to commit"; exit 0
          fi
          git config user.name Git
          git config user.email git@example.com
          git add public/temp/vpn.json scripts/update-apps/state.json
          git commit -m "Update app downloads"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
