name: board-preview

# Preview of 事件墙: deploys new-site/ with `--env board` to the Worker end-gfw-board-preview
# (board-preview.end-gfw.com). Does not touch end-gfw-new (end-gfw.com / v2.end-gfw.com).
on:
  push:
    branches: [board-preview]
    paths: ['new-site/**', '.github/workflows/board-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN not set, skipping deploy"; exit 0; fi
          npx wrangler deploy --env board
