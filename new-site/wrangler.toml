name = "end-gfw-new"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Pages are built from pages/ + partials/ into public/ by `npm run build`
[assets]
directory = "./public"
binding = "ASSETS"
# Paths without a page here go to the Worker, which hands them to the old site
not_found_handling = "none"
run_worker_first = ["/share", "/share-get", "/s/*", "/api/*", "/pay/*", "/download-app/*", "/download-pdf/*", "/news-resource/*", "/google3265592cabe77d27.html", "/googlebe5a4faac22676fb.html"]

# The old site (temp v1 branch, legacy-site/) for everything this site does not have
[[services]]
binding = "LEGACY"
service = "end-gfw-legacy"

[[routes]]
pattern = "v2.end-gfw.com"
custom_domain = true

# end-gfw.com itself (2026-09-28, taken over from the old site's Worker, which keeps
# v1.end-gfw.com until 2026-10-15). Rollback: remove these two, deploy, then put them
# back in legacy-site/wrangler.toml on the v1 branch.
[[routes]]
pattern = "end-gfw.com/*"
zone_name = "end-gfw.com"

[[routes]]
pattern = "www.end-gfw.com/*"
zone_name = "end-gfw.com"

[vars]
# xrayr-next shared account for the website and YouTube (sg3, sg33, kr3, 30 Mbit)
WEB_TOKEN = "bf5129f1-31f5-4edf-a07a-27ec31b26c1d"
# xrayr-next public subscription domains, tried in order (swap here when one is blocked)
XN_BASES = "https://sub2.anti-involution.net,https://sub2.food-safety.academy"
# Lambda end-gfw-legacy-api (old site's secret/MongoDB routes): previous-system
# check-in and the mail list's email check-in
LEGACY_API = "https://emrxzwdnbpgw7bkgjnbgskmwfq0gsnwh.lambda-url.us-east-1.on.aws"
# 加密分享 (/share, enabled 2026-09-29): ciphertext storage on Debian-1-1 (new-site/share-store/), key in the
# Worker secret SHARE_STORE_KEY (= SSM /end-gfw/share/STORE_KEY; set in the dashboard, kept by
# wrangler deploy). Dashboard edits from a stale settings page can drop these vars; redeploy then.
# Reached through the Cloudflare Tunnel end-gfw-share (new-site/tunnel/): Debian-1-1 has no
# public web port and its IP is not in DNS.
SHARE_STORE_URL = "https://share-store.end-gfw.com"
# 事件墙 service on Debian-1-2 (new-site/board-server/); secret BOARD_KEY (= SSM /end-gfw/board/BOARD_KEY)
# set in the dashboard. Reached through the Cloudflare Tunnel end-gfw-board (new-site/tunnel/):
# Debian-1-2 has no public web port and its IP is not in DNS.
BOARD_URL = "https://board-store.end-gfw.com"
# Backup links on the upload page: the website account's mirror IPs and the main domain
SHARE_MIRROR_LINKS = "1"
# 加密聊天 service on Debian-1-2 (new-site/chat-server/), served at /chat. Reached through the
# Cloudflare Tunnel end-gfw-chat (-> 127.0.0.1:8792); the direct https://<node IP>:8443/chat relays
# stay as the backup entries (TLS ends on Debian-1-2 there).
CHAT_URL = "https://chat-store.end-gfw.com"
SHARE_SITE_URL = "https://end-gfw.com"

# 加密分享 per-IP limits (skipped for the website's mirror nodes, whose nginx limits each visitor)
[[ratelimits]]
name = "SHARE_UPLOAD_LIMIT"
namespace_id = "7201"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SHARE_READ_LIMIT"
namespace_id = "7202"
simple = { limit = 60, period = 60 }

# No request logging: the footer tells visitors the site keeps no access logs
[observability]
enabled = false

# ---------------------------------------------------------------------------
# Preview environment for 加密分享 changes: `wrangler deploy --env preview`, from the
# share-preview branch (.github/workflows/share-preview.yml).
# routes, vars, services and observability are not inherited by environments.
[env.preview]
name = "end-gfw-share-preview"
workers_dev = false
routes = [{ pattern = "share-preview.end-gfw.com", custom_domain = true }]

[env.preview.vars]
WEB_TOKEN = "bf5129f1-31f5-4edf-a07a-27ec31b26c1d"
XN_BASES = "https://sub2.anti-involution.net,https://sub2.food-safety.academy"
LEGACY_API = "https://emrxzwdnbpgw7bkgjnbgskmwfq0gsnwh.lambda-url.us-east-1.on.aws"
# Ciphertext storage on Debian-1-1 (new-site/share-store/). The key is the Worker secret
# SHARE_STORE_KEY (= SSM /end-gfw/share/STORE_KEY), set in the Cloudflare dashboard.
# Reached through the Cloudflare Tunnel end-gfw-share (new-site/tunnel/).
SHARE_STORE_URL = "https://share-store.end-gfw.com"
# Backup links on the upload page: mirrors proxy end-gfw.com, where /share is not live yet
SHARE_MIRROR_LINKS = "0"
# Preview only: storage error messages in API responses
SHARE_DEBUG = "1"

[[env.preview.services]]
binding = "LEGACY"
service = "end-gfw-legacy"

# Per-IP limits: uploads, and reads of file info / ciphertext / delete (skipped for
# requests from mirror nodes, whose nginx limits each visitor)
[[env.preview.ratelimits]]
name = "SHARE_UPLOAD_LIMIT"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[env.preview.ratelimits]]
name = "SHARE_READ_LIMIT"
namespace_id = "7102"
simple = { limit = 60, period = 60 }

# Worker logs on for the preview (requested). The share code logs no IPs, links or keys;
# the #key part of a link never reaches the server.
[env.preview.observability]
enabled = true

# ---------------------------------------------------------------------------
# 事件墙 preview: `wrangler deploy --env board` from the board-preview branch
# (.github/workflows/board-preview.yml) -> Worker end-gfw-board-preview on board-preview.end-gfw.com.
# Does not touch end-gfw-new (end-gfw.com / v2.end-gfw.com). The board service runs on
# Debian-1-2 (new-site/board-server/). Secret BOARD_KEY (= SSM /end-gfw/board/BOARD_KEY) is set
# in the Cloudflare dashboard. routes, vars, services and observability are not inherited.
[env.board]
name = "end-gfw-board-preview"
workers_dev = false
routes = [{ pattern = "board-preview.end-gfw.com", custom_domain = true }]

[env.board.vars]
WEB_TOKEN = "bf5129f1-31f5-4edf-a07a-27ec31b26c1d"
XN_BASES = "https://sub2.anti-involution.net,https://sub2.food-safety.academy"
LEGACY_API = "https://emrxzwdnbpgw7bkgjnbgskmwfq0gsnwh.lambda-url.us-east-1.on.aws"
# Reached through the Cloudflare Tunnel end-gfw-board (new-site/tunnel/)
BOARD_URL = "https://board-store.end-gfw.com"

[[env.board.services]]
binding = "LEGACY"
service = "end-gfw-legacy"

[env.board.observability]
enabled = false
