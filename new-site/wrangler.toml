name = "end-gfw-new"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Pages are built from pages/ + partials/ into public/ by `npm run build`
[assets]
directory = "./public"
binding = "ASSETS"
# Paths without a page here go to the Worker, which hands them to the old site
not_found_handling = "none"
run_worker_first = ["/api/*", "/pay/*", "/download-app/*", "/download-pdf/*", "/news-resource/*", "/google3265592cabe77d27.html", "/googlebe5a4faac22676fb.html"]

# The old site (temp v1 branch, legacy-site/) for everything this site does not have
[[services]]
binding = "LEGACY"
service = "end-gfw-legacy"

[[routes]]
pattern = "v2.end-gfw.com"
custom_domain = true

# end-gfw.com itself (2026-09-28, taken over from the old site's Worker, which keeps
# v1.end-gfw.com until 2026-10-15). Rollback: remove these two, deploy, then put them
# back in legacy-site/wrangler.toml on the v1 branch.
[[routes]]
pattern = "end-gfw.com/*"
zone_name = "end-gfw.com"

[[routes]]
pattern = "www.end-gfw.com/*"
zone_name = "end-gfw.com"

[vars]
# xrayr-next shared account for the website and YouTube (sg3, sg33, kr3, 30 Mbit)
WEB_TOKEN = "bf5129f1-31f5-4edf-a07a-27ec31b26c1d"
# xrayr-next public subscription domains, tried in order (swap here when one is blocked)
XN_BASES = "https://sub2.anti-involution.net,https://sub2.food-safety.academy"
# Lambda end-gfw-legacy-api (old site's secret/MongoDB routes): previous-system
# check-in and the mail list's email check-in
LEGACY_API = "https://emrxzwdnbpgw7bkgjnbgskmwfq0gsnwh.lambda-url.us-east-1.on.aws"

# No request logging: the footer tells visitors the site keeps no access logs
[observability]
enabled = false

# 事件墙 preview: `wrangler deploy --env board` from the board-preview branch
# (.github/workflows/board-preview.yml) -> Worker end-gfw-board-preview on board-preview.end-gfw.com.
# Does not touch end-gfw-new (end-gfw.com / v2.end-gfw.com). The board service runs on
# Debian-1-2 (new-site/board-server/). Secret BOARD_KEY (= SSM /end-gfw/board/BOARD_KEY) is set
# in the Cloudflare dashboard. routes, vars, services and observability are not inherited.
[env.board]
name = "end-gfw-board-preview"
workers_dev = false
routes = [{ pattern = "board-preview.end-gfw.com", custom_domain = true }]

[env.board.vars]
WEB_TOKEN = "bf5129f1-31f5-4edf-a07a-27ec31b26c1d"
XN_BASES = "https://sub2.anti-involution.net,https://sub2.food-safety.academy"
LEGACY_API = "https://emrxzwdnbpgw7bkgjnbgskmwfq0gsnwh.lambda-url.us-east-1.on.aws"
# Port 8443, not 443: the zone's Flexible SSL mode would turn a :443 subrequest into plain HTTP
BOARD_URL = "https://board-store.end-gfw.com:8443"

[[env.board.services]]
binding = "LEGACY"
service = "end-gfw-legacy"

[env.board.observability]
enabled = false
