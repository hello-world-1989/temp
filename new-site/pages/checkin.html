title: 签到
description: 订阅链接 ID 签到（到期后续用订阅链接）和邮箱签到（到期后继续收到节点邮件），每次从签到当天起延长 4 天。
nav: checkin
script: checkin.js
-->
<section class="page-head">
  <div class="wrap">
    <span class="eyebrow">签到</span>
    <h1>签到续用</h1>
    <p>免费用户需要定期签到。每次签到从当天起延长 4 天，已经过期的也可以直接签到恢复；剩余时间还多于 4 天时签到不会改变到期时间。</p>
  </div>
</section>

<section class="section-tight">
  <div class="wrap grid grid-2">
    <form id="id-form" class="card feature" novalidate>
      <h2>订阅链接 ID 签到</h2>
      <p class="muted">订阅链接到期后，签到即可继续使用同一条订阅链接，不用重新导入。新旧系统的订阅都可以签到。</p>
      <div class="field mt">
        <label for="token">订阅链接或 token</label>
        <input id="token" class="input" autocomplete="off" spellcheck="false" placeholder="粘贴整条订阅链接，或 token= 后面的那一串">
      </div>
      <button class="btn btn-primary mt" type="submit" id="id-submit">签到</button>
      <p class="notice mt" id="id-msg" role="status"></p>
    </form>

    <form id="email-form" class="card feature" novalidate>
      <h2>邮箱签到</h2>
      <p class="muted">通过邮件领取节点的用户，到期后系统不再给你的邮箱发送节点。签到后恢复，可以继续发邮件领取节点。</p>
      <div class="field mt">
        <label for="email">领取节点时用的邮箱</label>
        <input id="email" class="input" type="email" autocomplete="email" spellcheck="false" placeholder="例如 name@gmail.com">
      </div>
      <button class="btn btn-primary mt" type="submit" id="email-submit">签到</button>
      <p class="notice mt" id="email-msg" role="status"></p>
    </form>
  </div>
</section>

<section class="section-tight">
  <div class="wrap">
    <div class="notice">
      还没有订阅？首页有 <a href="/#free">免费订阅链接和节点</a>，不用签到；也可以 <a href="/faq#email-nodes">发邮件领取节点</a>，或 <a href="/plans">赞助</a> 获得更快的线路。有问题请发邮件到 <a href="mailto:end.gfw@hotmail.com">end.gfw@hotmail.com</a>。
    </div>
  </div>
</section>
