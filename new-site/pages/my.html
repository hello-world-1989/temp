nav: my
script: my.js

<section class="page-head">
  <div class="wrap">
    <span class="eyebrow">我的订阅</span>
    <h1>查看订阅、签到、续费</h1>
    <p>输入订阅 token，或直接粘贴整条订阅链接。token 只保存在你自己的浏览器里。</p>
  </div>
</section>

<section class="section-tight">
  <div class="wrap">
    <form id="lookup" class="card feature" novalidate>
      <div class="field">
        <label for="token">订阅 token 或订阅链接</label>
        <div class="row">
          <input id="token" class="input" autocomplete="off" spellcheck="false" placeholder="例如 https://…/sub?token=xxxx 或 xxxx">
          <button class="btn btn-primary" type="submit">查看</button>
        </div>
      </div>
      <p class="notice mt" id="lookup-msg" role="alert"></p>
    </form>
  </div>
</section>

<section class="section-tight hidden" id="result">
  <div class="wrap grid">
    <div class="card feature">
      <div class="section-head">
        <h2>订阅状态</h2>
        <div class="row">
          <button class="btn btn-ghost btn-sm" id="renew" type="button">签到</button>
          <a class="btn btn-primary btn-sm" id="extend" href="/plans">续费 / 升级</a>
        </div>
      </div>
      <dl class="kv" id="status"></dl>
      <p class="notice mt" id="renew-msg" role="status"></p>
    </div>

    <div class="card feature">
      <h2>订阅链接</h2>
      <p class="muted">复制后在客户端里“从剪贴板导入”或“添加订阅”。主链接打不开时用备用链接。</p>
      <div id="links"></div>
    </div>

    <div class="card feature">
      <h2>本月以来的流量</h2>
      <dl class="kv" id="traffic"></dl>
    </div>

    <p class="center"><button class="btn btn-ghost btn-sm" id="forget" type="button">在这台设备上忘记 token</button></p>
  </div>
</section>
